<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turntable · Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #fit { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; flex: none; width: 1440px; height: 900px; color: #F2F2F2;
           font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  header { position: absolute; top: 36px; left: 80px; right: 80px; display: flex; justify-content: space-between; align-items: center; }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .source { font-size: 13px; color: #8A8A8A; letter-spacing: 0.06em; }

  #panel { position: absolute; left: 112px; top: 114px; width: 672px; height: 672px; box-sizing: border-box; padding: 16px;
           background: #0A0A0A; border: 1px solid #1E1E1E; border-radius: 6px; transition: box-shadow .8s ease; }
  #panel .inner { position: relative; width: 640px; height: 640px; }
  #face { width: 640px; height: 640px; background-size: 38400px 640px; background-repeat: no-repeat; image-rendering: pixelated;
          filter: saturate(1.15) brightness(1.05); animation: turn var(--spin, 3s) steps(60) infinite; }
  @keyframes turn { from { background-position: 0 0; } to { background-position: -38400px 0; } }
  .paused #face { animation-play-state: paused; }
  #leds { position: absolute; inset: 0; background-size: 10px 10px;
          background-image: radial-gradient(circle at center, rgba(0,0,0,0) 0, rgba(0,0,0,0) 3.2px, #050505 4.4px); }

  #info { position: absolute; left: 900px; top: 196px; width: 460px; display: flex; flex-direction: column; gap: 14px; }
  .kicker { font-size: 13px; letter-spacing: 0.14em; color: #8A8A8A; }
  h1 { margin: 0; font-size: 92px; line-height: .92; font-weight: 800; letter-spacing: -0.04em; }
  #artist { margin: 6px 0 0; font-size: 30px; font-weight: 600; color: #D6D6D6; }
  #meta { margin: 0; font-size: 14px; color: #8A8A8A; }

  #progress { position: absolute; left: 900px; top: 560px; width: 420px; }
  #bars { display: flex; gap: 4px; height: 36px; align-items: flex-end; }
  #bars i { display: block; width: 4px; border-radius: 1px; }
  .times { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; color: #8A8A8A; }

  #controls { position: absolute; left: 900px; top: 650px; display: flex; gap: 14px; align-items: center; }
  .round { width: 56px; height: 56px; border-radius: 28px; border: 2px solid #F2F2F2; background: transparent; color: #F2F2F2;
           display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #play { height: 56px; padding: 0 28px; border-radius: 28px; border: 0; color: #000; display: flex; align-items: center; gap: 10px;
          font: 600 17px 'Bricolage Grotesque', sans-serif; cursor: pointer; transition: background .6s ease; }
  button:focus-visible { outline: 3px solid #F2F2F2; outline-offset: 4px; }
  .ico-play { display: none; } .paused .ico-play { display: block; } .paused .ico-pause { display: none; }

  footer { position: absolute; left: 80px; right: 80px; bottom: 40px; display: flex; justify-content: space-between; font-size: 13px; color: #8A8A8A; }
  @media (prefers-reduced-motion: reduce) { #face { animation: none; } }
</style>
</head>
<body>
<div id="fit">
  <main id="stage">
    <header><div class="brand">turntable.</div><div class="source mono">SPOTIFY · THIS MAC</div></header>

    <div id="panel" aria-hidden="true"><div class="inner"><div id="face"></div><div id="leds"></div></div></div>

    <section id="info">
      <div class="kicker mono">NOW SPINNING</div>
      <h1 id="title"></h1>
      <p id="artist"></p>
      <p id="meta" class="mono"></p>
    </section>

    <div id="progress">
      <div id="bars" role="progressbar" aria-label="Track progress" aria-valuemin="0" aria-valuemax="100"></div>
      <div class="times mono"><span id="at"></span><span id="length"></span></div>
    </div>

    <div id="controls">
      <button id="prev" class="round" aria-label="Previous track"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h2v14H7z"/><path d="M19 5v14L10 12z"/></svg></button>
      <button id="play" aria-label="Pause">
        <svg class="ico-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7z"/><path d="M13.5 5H17v14h-3.5z"/></svg>
        <svg class="ico-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <span id="playText">Pause</span>
      </button>
      <button id="next" class="round" aria-label="Next track"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15 5h2v14h-2z"/><path d="M5 5v14l9-7z"/></svg></button>
    </div>

    <footer class="mono"><span id="upnext"></span><span id="rpm"></span></footer>
  </main>
</div>

<script src="assets/manifest.js"></script>
<script>
// Keys: Space = play/pause, Left/Right = previous/next.
(function () {
  const M = window.TURNTABLE;
  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const N = 48;
  const ticks = Array.from({ length: N }, (_, i) => {
    const el = document.createElement('i');
    el.style.height = (12 + Math.round(18 * Math.abs(Math.sin(i * 1.7)) + 6 * Math.abs(Math.sin(i * 0.45)))) + 'px';
    $('bars').appendChild(el);
    return el;
  });
  const S = { idx: 0, playing: true, pos: 107 };
  const mmss = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

  document.documentElement.style.setProperty('--spin', M.spinSeconds + 's');
  $('rpm').textContent = 'CD · ' + Math.round(60 / M.spinSeconds) + ' RPM';

  function render(trackChanged) {
    const a = M.albums[S.idx], up = M.albums[(S.idx + 1) % M.albums.length];
    if (trackChanged) {
      const words = a.title.split(' ');
      const half = Math.ceil(words.length / 2);
      $('title').innerHTML = '';
      $('title').append(words.slice(0, half).join(' '), document.createElement('br'), words.slice(half).join(' '));
      $('artist').textContent = a.artist;
      $('meta').textContent = a.album + ' · ' + a.track;
      $('length').textContent = mmss(a.length);
      $('upnext').textContent = 'UP NEXT · ' + up.title + ', ' + up.artist;
      $('face').style.backgroundImage = `url(${a.discLed})`;
      $('panel').style.boxShadow = `0 0 140px ${a.accent}2E`;
      $('play').style.background = a.accent;
    }
    const done = Math.round(N * S.pos / a.length);
    ticks.forEach((t, i) => { t.style.background = i < done ? a.accent : '#2A2A2A'; });
    $('bars').setAttribute('aria-valuenow', Math.round(100 * S.pos / a.length));
    $('at').textContent = mmss(S.pos);
    stage.classList.toggle('paused', !S.playing);
    $('playText').textContent = S.playing ? 'Pause' : 'Play';
    $('play').setAttribute('aria-label', S.playing ? 'Pause' : 'Play');
  }

  const toggle = () => { S.playing = !S.playing; render(false); };
  const go = (d) => { S.idx = (S.idx + d + M.albums.length) % M.albums.length; S.pos = 0; render(true); };

  $('play').addEventListener('click', toggle);
  $('prev').addEventListener('click', () => go(-1));
  $('next').addEventListener('click', () => go(1));
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  });

  setInterval(() => {
    if (!S.playing) return;
    S.pos += 1;
    if (S.pos >= M.albums[S.idx].length) go(1); else render(false);
  }, 1000);

  function fit() { stage.style.transform = `scale(${Math.min(innerWidth / 1440, innerHeight / 900)})`; }
  addEventListener('resize', fit);
  fit();
  render(true);
})();
</script>
</body>
</html>
